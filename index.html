<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b3d2e" />
  <meta name="description" content="汇率通 — 每日更新的多币种汇率转换器" />
  <title>汇率通</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>

  <main class="app">
    <header class="brand">
      <p class="brand-mark">汇率通</p>
      <p class="brand-tag">每日同步 · 实时换算</p>
    </header>

    <section class="converter" aria-label="汇率转换">
      <div class="field">
        <label for="amount">金额</label>
        <input id="amount" type="text" inputmode="decimal" value="100" autocomplete="off" />
      </div>

      <div class="pair">
        <div class="field">
          <label for="from">从</label>
          <select id="from"></select>
        </div>

        <button type="button" class="swap" id="swap" aria-label="交换币种" title="交换币种">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M7 7h11l-3-3M17 17H6l3 3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <div class="field">
          <label for="to">到</label>
          <select id="to"></select>
        </div>
      </div>

      <div class="result" id="result" aria-live="polite">
        <p class="result-label">换算结果</p>
        <p class="result-value" id="resultValue">—</p>
        <p class="result-rate" id="resultRate"></p>
      </div>
    </section>

    <section class="meta">
      <p class="status" id="status">正在获取最新汇率…</p>
      <p class="mobile-hint" id="mobileHint" hidden></p>
      <button type="button" class="refresh" id="refresh">刷新汇率</button>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
